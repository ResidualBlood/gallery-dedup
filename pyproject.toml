[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gallery-dedup"
version = "0.1.0"
description = "Pure Python algorithms for gallery title normalization, artist extraction, and duplicate clustering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gallery_dedup"]
